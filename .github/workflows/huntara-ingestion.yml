name: HUNTARA Job Ingestion

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Run HUNTARA Greenhouse ingestion
        run: |
          curl -X POST "https://huntara.vercel.app/api/internal/ingest/greenhouse" \
            -H "x-ingestion-secret: ${{ secrets.HUNTARA_INGESTION_SECRET }}" \
            -H "Content-Type: application/json"