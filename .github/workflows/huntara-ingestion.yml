name: HUNTARA Job Ingestion

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  greenhouse:
    runs-on: ubuntu-latest
    steps:
      - name: Run HUNTARA Greenhouse ingestion
        run: |
          curl --fail-with-body -X POST "https://huntara.vercel.app/api/internal/ingest/greenhouse" \
            -H "x-ingestion-secret: ${{ secrets.HUNTARA_INGESTION_SECRET }}" \
            -H "Content-Type: application/json"

  lever:
    runs-on: ubuntu-latest
    steps:
      - name: Run HUNTARA Lever ingestion
        run: |
          curl --fail-with-body -X POST "https://huntara.vercel.app/api/internal/ingest/lever" \
            -H "x-ingestion-secret: ${{ secrets.HUNTARA_INGESTION_SECRET }}" \
            -H "Content-Type: application/json"

  smartrecruiters:
    runs-on: ubuntu-latest
    steps:
