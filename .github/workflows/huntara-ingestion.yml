        run: |
          curl --fail-with-body -X POST "https://huntara.vercel.app/api/internal/ingest/smartrecruiters" \
            -H "x-ingestion-secret: ${{ secrets.HUNTARA_INGESTION_SECRET }}" \
            -H "Content-Type: application/json"

  ashby:
    runs-on: ubuntu-latest
    steps:
