        run: |
          curl --fail-with-body -X POST "https://huntara.vercel.app/api/internal/ingest/ashby" \
            -H "x-ingestion-secret: ${{ secrets.HUNTARA_INGESTION_SECRET }}" \
            -H "Content-Type: application/json"

  jobicy:
    runs-on: ubuntu-latest
    steps:
      - name: Run HUNTARA Jobicy ingestion
        run: |
          curl --fail-with-body -X POST "https://huntara.vercel.app/api/internal/ingest/jobicy" \
            -H "x-ingestion-secret: ${{ secrets.HUNTARA_INGESTION_SECRET }}" \
            -H "Content-Type: application/json"

  remoteok:
    runs-on: ubuntu-latest
    steps:
      - name: Run HUNTARA Remote OK ingestion
        run: |
          curl --fail-with-body -X POST "https://huntara.vercel.app/api/internal/ingest/remoteok" \
            -H "x-ingestion-secret: ${{ secrets.HUNTARA_INGESTION_SECRET }}" \
            -H "Content-Type: application/json"